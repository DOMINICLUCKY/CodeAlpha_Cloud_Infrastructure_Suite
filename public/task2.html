<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SQL Injection Defense</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8 font-sans min-h-screen">
  <div class="max-w-3xl mx-auto space-y-6">
    <a href="index.html" class="text-indigo-400 text-sm font-medium hover:underline">← Return to Dashboard</a>
    <h1 class="text-2xl font-bold text-slate-100">SQL Injection Detection System</h1>
    
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
      <label class="block text-xs text-slate-400">Query Input Test</label>
      <input type="text" id="sqli" placeholder="Enter string or SQL query..." class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg focus:outline-none focus:border-emerald-500 text-sm font-mono">
      <button id="btn" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium transition">
        Run Inspection
      </button>
      <div id="resBox" class="p-4 text-sm rounded-lg hidden font-mono"></div>
    </div>
  </div>
  <script>
    btn.onclick = async () => {
      const res = await fetch('/api/task2/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ query: sqli.value })
      });
      const data = await res.json();
      resBox.className = `p-4 text-sm rounded-lg font-mono border ${res.ok ? 'bg-emerald-950/40 border-emerald-500 text-emerald-300' : 'bg-red-950/40 border-red-500 text-red-300'}`;
      resBox.innerText = data.message;
      resBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
