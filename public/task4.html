<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8 font-sans min-h-screen">
  <div class="max-w-2xl mx-auto space-y-6">
    <a href="index.html" class="text-indigo-400 text-sm font-medium hover:underline">← Return to Dashboard</a>
    <h1 class="text-2xl font-bold text-slate-100">Automated Assistant Interface</h1>
    
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl h-80 overflow-y-auto space-y-3 font-mono text-xs" id="chat"></div>
    <div class="flex gap-2">
      <input type="text" id="msg" placeholder="Ask about system operations..." class="flex-1 bg-slate-900 border border-slate-800 p-2.5 rounded-lg focus:outline-none focus:border-purple-500 text-sm">
      <button id="send" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-sm font-medium transition">
        Send
      </button>
    </div>
  </div>
  <script>
    send.onclick = async () => {
      if(!msg.value) return;
      chat.innerHTML += `<div class="text-right text-purple-300"><b>User:</b> ${msg.value}</div>`;
      const res = await fetch('/api/task4/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message: msg.value })
      });
      const data = await res.json();
      chat.innerHTML += `<div class="text-left text-slate-300"><b>System:</b> ${data.reply}</div>`;
      msg.value = '';
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
